<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>What If Apple Made Shoes?</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #eeeeee;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    padding: 40px 0;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
}

/* CREATIVE */

.slide {
    width: 800px;
    height: 1000px;
    background: #f5f5f7;
    position: relative;
    overflow: hidden;
}

/* IMAGE */

.hero-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* SMALL PERSONAL BRAND FOOTER */

.credit {
    position: absolute;
    bottom: 24px;
    right: 30px;

    font-size: 11px;
    letter-spacing: 1.5px;

    color: rgba(0,0,0,.55);
    text-transform: uppercase;
}

/* LABEL ABOVE CREATIVE */

.slide-label {
    width: 800px;
    font-size: 12px;
    color: #777;
    letter-spacing: 1px;
    text-transform: uppercase;
}

</style>
</head>

<body>

<div class="container">

    <div class="slide-label">
        Brand Experiment 001
    </div>

    <div class="slide">

        <img
            src="apple1.png"
            class="hero-image"
            alt="What if Apple made shoes?"
        >

        <div class="credit">
            Concept by Preeti Mishra
        </div>

    </div>

</div>

</body>
</html>
